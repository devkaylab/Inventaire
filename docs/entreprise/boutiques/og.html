<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Quantinvo — image de partage</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Public+Sans:wght@400&display=swap">
<style>
  /* ⚠️ Ce fichier EST l'image de partage, à sa taille exacte : 1200 × 630 —
     celle qu'attendent Open Graph et les cartes LinkedIn, Slack, iMessage.
     Elle se rend en PNG par `produire.mjs`, qui l'écrit dans `web/public/`.

     ⚠️ **C'est le visuel le plus VU des trois, et de loin.** Le bandeau Play et
     l'icône attendent une publication ; celui-ci part à chaque fois qu'un lien
     du site est collé quelque part. C'est la première chose qu'un prospect
     voit de Quantinvo, avant même d'ouvrir la page.

     ⚠️ **RECOMPOSÉE LE 13 SEPTEMBRE 2026, et pas seulement recolorée.** La
     mise en page d'avant reposait tout entière sur deux objets qui n'existent
     plus : le cube isométrique débordant à gauche, et le filet de scan cyan
     qui le prolongeait en travers de l'image. Les deux ont quitté le produit
     le 6 septembre. Repeindre cette composition n'aurait servi à rien — il n'y
     avait plus rien à peindre.

     Ce qui la remplace est **la composition du bandeau Play**, au corps près.
     Deux formats, un seul message, une seule marque : la variété n'aurait rien
     apporté ici, et deux mises en page à tenir d'accord divergent toujours.
     Les règles d'Ardoise sont les mêmes des deux côtés — fond minéral uni,
     marque monochrome, Archivo et Public Sans, et **l'accent sur la seule
     seconde ligne du titre**, la seule chose qui engage sur une image.

     ⚠️ **Le titre est plus gros ici que sur le bandeau** (88 contre 74) : le
     format est plus large de 176 px et ne subit aucun recadrage latéral, donc
     la phrase peut occuper. C'est le seul écart entre les deux fichiers, et il
     est mesuré, pas décoratif.

     ⚠️ **PAS DE DÉCOR — essayé le 13 septembre, retiré le jour même.** Le plan
     de magasin agrandi et coupé par le bord perd son cadre : il ne reste que
     des bandes verticales qui se lisent comme un défaut de rendu, pas comme la
     marque. Ardoise n'habille pas un fond pour le remplir. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(155deg, #171b19 0%, #141716 48%, #0e1110 100%);
    font-family: Archivo, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .contenu {
    position: absolute; inset: 0;
    padding: 76px 84px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 32px;
  }

  /* La marque, en petit : elle situe, elle n'annonce pas. Le rapport entre le
     signe et le mot est celui de la barre du site — logo 1,33 × le corps. */
  .marque { display: flex; align-items: center; gap: 15px; color: #ecefec; }
  .marque svg { width: 52px; height: 52px; display: block; }
  .mot {
    font-weight: 700; font-size: 39px; letter-spacing: -.017em; line-height: 1;
  }

  /* Le sujet de l'image. */
  .titre {
    font-weight: 700; font-size: 88px; line-height: 1.08;
    letter-spacing: -.025em; color: #ecefec;
  }
  .titre span { color: #8fc9b0; }

  .sous {
    font-family: 'Public Sans', sans-serif; font-weight: 400; font-size: 28px;
    color: #9aa39e; line-height: 1.3;
  }
</style>
</head>
<body>
  <div class="contenu">
    <div class="marque">
      <!-- Le plan de magasin : le cadre, deux allées en attente, celle qu'on
           compte. Géométrie identique à `web/components/Logo.tsx`. -->
      <svg viewBox="0 0 36 36" aria-hidden="true">
        <rect x="1.5" y="1.5" width="33" height="33" fill="none" stroke="currentColor" stroke-width="3"/>
        <rect x="11" y="3" width="3" height="30" fill="currentColor"/>
        <rect x="22" y="3" width="3" height="30" fill="currentColor"/>
        <rect x="3" y="3" width="8" height="30" fill="currentColor"/>
      </svg>
      <span class="mot">Quantinvo</span>
    </div>

    <h1 class="titre">La fiabilité du stock<br><span>au quotidien</span></h1>

    <p class="sous">L’outil d’inventaire pour le commerce de détail.</p>
  </div>
</body>
</html>
