<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Quantinvo — bandeau Google Play</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500&display=swap">
<style>
  /* ⚠️ Ce fichier EST le bandeau, à sa taille exacte : 1024 × 500. Il se rend
     en PNG par `produire.mjs`. Ne pas retoucher l'image produite — elle serait
     écrasée à la génération suivante ; c'est ici qu'on modifie.

     Piste retenue : « le geste ». Le cube déborde du cadre à gauche et la
     ligne de scan le prolonge sur toute la largeur. C'est le seul geste
     graphique que la marque possède, joué en grand.

     ⚠️ **La ligne est posée à la hauteur de la barre cyan du cube**, pas au
     milieu de l'image : c'est ce qui la fait lire comme le prolongement du
     logo plutôt que comme un trait décoratif posé par-dessus. La barre du cube
     est à 56,25 % de sa hauteur (y = 288 sur 512) — si la taille du cube
     change, cette valeur se recalcule.

     ⚠️ **La barre interne du cube est retirée ici, et seulement ici.** Elle
     ferait doublon avec la ligne qui la prolonge. Le logo de l'application, du
     site et des e-mails la garde.

     Les polices sont celles de la charte (Sora, Inter). Elles sont installées
     sur le poste de Julien, donc le rendu tient même hors ligne ; le lien
     Google Fonts n'est qu'un filet. `produire.mjs` refuse de sortir l'image si
     Sora n'a pas été résolue — un bandeau tombé en Helvetica ne se voit pas
     sur une capture, mais se voit sur la fiche. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    background: #0B0F19;
    font-family: Sora, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .voile {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 140% at 18% 8%, rgba(116,102,244,.34) 0%, rgba(11,15,25,0) 58%),
      linear-gradient(140deg, #17123A 0%, #0B0F19 52%, #090C14 100%);
  }

  /* Le cube : 348 px, débordant de 62 px à gauche, centré verticalement.
     Sa barre cyan tomberait à 76 + 348 × 0,5625 = 272 px du haut. */
  .cube {
    position: absolute; left: -62px; top: 76px;
    width: 348px; height: 348px; display: block;
  }
  .ligne {
    position: absolute; left: 0; right: 0; top: 272px; height: 6px;
    transform: translateY(-50%);
    background: linear-gradient(90deg,
      rgba(56,201,255,0) 0%, #38C9FF 13%, #38C9FF 87%, rgba(56,201,255,0) 100%);
  }

  /* Le texte est aligné à droite mais s'arrête à 104 px du bord : Play recadre
     le bandeau selon les surfaces, rien d'important ne doit toucher les bords.
     C'est le cube qui accepte d'être coupé, pas les mots. */
  .texte {
    position: absolute; right: 104px; top: 272px;
    transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 40px;
  }
  .mot {
    font-weight: 800; font-size: 58px; letter-spacing: -.015em; color: #FFFFFF;
    line-height: 1;
  }
  .phrase {
    font-family: Inter, sans-serif; font-weight: 400; font-size: 26px;
    color: #C9CEDD; line-height: 1;
  }
  .phrase span { color: #FFFFFF; font-weight: 500; }
</style>
</head>
<body>
  <div class="voile"></div>

  <svg class="cube" viewBox="0 0 512 512" aria-hidden="true">
    <defs>
      <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7466F4"/>
        <stop offset=".52" stop-color="#4636B0"/>
        <stop offset="1" stop-color="#1C153F"/>
      </linearGradient>
    </defs>
    <rect x="6" y="6" width="500" height="500" rx="116" fill="url(#qbg)"/>
    <polygon points="256,146 352,196 256,246 160,196" fill="#A99CFA"/>
    <polygon points="160,196 256,246 256,366 160,316" fill="#6E5DEC"/>
    <polygon points="352,196 352,316 256,366 256,246" fill="#4A3AA8"/>
  </svg>

  <div class="ligne"></div>

  <div class="texte">
    <div class="mot">Quantinvo</div>
    <p class="phrase">La fiabilité du stock <span>au quotidien</span></p>
  </div>
</body>
</html>
